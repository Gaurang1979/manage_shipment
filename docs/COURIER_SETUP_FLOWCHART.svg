<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:32px;font-weight:700}.box{fill:#fff;stroke:#4b6385;stroke-width:2}.head{fill:#edf3fa;stroke:#4b6385;stroke-width:2}.t{font-size:20px;font-weight:700}.s{font-size:16px}.arrow{stroke:#4b6385;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#4b6385"/></marker></defs><rect width="1400" height="760" fill="#f7f9fc"/><text x="700" y="55" text-anchor="middle" class="title">Manage Shipment — Courier Setup Flow</text><rect x="80" y="110" width="250" height="110" rx="12" class="head"/><text x="205" y="150" text-anchor="middle" class="t">Create Provider</text><text x="205" y="180" text-anchor="middle" class="s">Name, code, active</text><path d="M330 165 H430" class="arrow"/><rect x="430" y="110" width="270" height="110" rx="12" class="head"/><text x="565" y="150" text-anchor="middle" class="t">Tracking Configuration</text><text x="565" y="180" text-anchor="middle" class="s">URL + tracking template</text><path d="M700 165 H800" class="arrow"/><rect x="800" y="110" width="270" height="110" rx="12" class="head"/><text x="935" y="150" text-anchor="middle" class="t">API Configuration</text><text x="935" y="180" text-anchor="middle" class="s">Endpoint + credentials</text><path d="M1070 165 H1170" class="arrow"/><rect x="1170" y="110" width="180" height="110" rx="12" class="head"/><text x="1260" y="150" text-anchor="middle" class="t">Test</text><text x="1260" y="180" text-anchor="middle" class="s">Use test AWB</text><path d="M1260 220 V310" class="arrow"/><rect x="1040" y="310" width="310" height="110" rx="12" class="box"/><text x="1195" y="350" text-anchor="middle" class="t">Tracking works?</text><text x="1195" y="380" text-anchor="middle" class="s">Yes → enable production</text><text x="1195" y="402" text-anchor="middle" class="s">No → check endpoint/auth</text><path d="M1040 365 H820" class="arrow"/><rect x="500" y="310" width="320" height="110" rx="12" class="head"/><text x="660" y="350" text-anchor="middle" class="t">Enable Tracking</text><text x="660" y="380" text-anchor="middle" class="s">Provider ready for shipments</text><path d="M660 420 V510" class="arrow"/><rect x="500" y="510" width="320" height="110" rx="12" class="head"/><text x="660" y="550" text-anchor="middle" class="t">Create Test Shipment</text><text x="660" y="580" text-anchor="middle" class="s">Refresh → verify event timeline</text><path d="M820 565 H1000" class="arrow"/><rect x="1000" y="510" width="350" height="110" rx="12" class="head"/><text x="1175" y="550" text-anchor="middle" class="t">Production Ready</text><text x="1175" y="580" text-anchor="middle" class="s">Scheduler can monitor active AWBs</text></svg>