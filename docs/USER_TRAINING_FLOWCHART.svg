<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:32px;font-weight:700}.box{fill:#fff;stroke:#4b6385;stroke-width:2}.head{fill:#edf3fa;stroke:#4b6385;stroke-width:2}.t{font-size:20px;font-weight:700}.s{font-size:16px}.arrow{stroke:#4b6385;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#4b6385"/></marker></defs><rect width="1400" height="820" fill="#f7f9fc"/><text x="700" y="55" text-anchor="middle" class="title">Manage Shipment — User Training Flow</text><rect x="80" y="110" width="250" height="105" rx="12" class="head"/><text x="205" y="150" text-anchor="middle" class="t">1. Create Shipment</text><text x="205" y="180" text-anchor="middle" class="s">Courier + AWB + consignee</text><path d="M330 162 H420" class="arrow"/><rect x="420" y="110" width="250" height="105" rx="12" class="head"/><text x="545" y="150" text-anchor="middle" class="t">2. Save / Submit</text><text x="545" y="180" text-anchor="middle" class="s">Tracking becomes active</text><path d="M670 162 H760" class="arrow"/><rect x="760" y="110" width="250" height="105" rx="12" class="head"/><text x="885" y="150" text-anchor="middle" class="t">3. Track</text><text x="885" y="180" text-anchor="middle" class="s">Manual or scheduled</text><path d="M1010 162 H1100" class="arrow"/><rect x="1100" y="110" width="220" height="105" rx="12" class="head"/><text x="1210" y="150" text-anchor="middle" class="t">4. Update</text><text x="1210" y="180" text-anchor="middle" class="s">Status + location + event</text><path d="M1210 215 V300" class="arrow"/><rect x="1000" y="300" width="320" height="110" rx="12" class="box"/><text x="1160" y="340" text-anchor="middle" class="t">5. Delivered?</text><text x="1160" y="370" text-anchor="middle" class="s">Yes → close tracking</text><text x="1160" y="392" text-anchor="middle" class="s">No → continue monitoring</text><path d="M1000 355 H820" class="arrow"/><rect x="500" y="300" width="320" height="110" rx="12" class="box"/><text x="660" y="340" text-anchor="middle" class="t">6. Exception?</text><text x="660" y="370" text-anchor="middle" class="s">NDR / delayed / address issue</text><text x="660" y="392" text-anchor="middle" class="s">Customer unavailable / lost</text><path d="M660 410 V500" class="arrow"/><rect x="500" y="500" width="320" height="110" rx="12" class="head"/><text x="660" y="540" text-anchor="middle" class="t">7. Follow-up</text><text x="660" y="570" text-anchor="middle" class="s">Assign person + date + remarks</text><text x="660" y="592" text-anchor="middle" class="s">Escalate or resolve</text><path d="M820 555 H1000" class="arrow"/><rect x="1000" y="500" width="320" height="110" rx="12" class="head"/><text x="1160" y="540" text-anchor="middle" class="t">8. Resolution</text><text x="1160" y="570" text-anchor="middle" class="s">Resolved / delivered / RTO</text><text x="1160" y="592" text-anchor="middle" class="s">Continue tracking if required</text><path d="M500 555 H330 V680 H1160 V610" class="arrow"/><text x="700" y="735" text-anchor="middle" class="s">Dashboard → filter by Courier / Status / Follow-up / Date → open shipment → review timeline</text></svg>